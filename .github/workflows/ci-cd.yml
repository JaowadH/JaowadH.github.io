name: Portfolio CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main # Trigger on PRs targeting the main branch

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x] # Test on multiple Node versions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Cache npm dependencies

      - name: Install dependencies
        run: npm install

      - name: Compile Sass
        # This script is defined in your root package.json
        # Example: sass sass/tooplate-style.scss css/tooplate-style.css --style=compressed
        run: npm run build:sass 

      - name: Verify build output
        run: |
          echo "Listing contents of css directory:"
          ls -l css/
          echo "Checking for css/tooplate-style.css..."
          # Ensure 'css/tooplate-style.css' matches the output of your 'build:sass' script
          if [ ! -f css/tooplate-style.css ]; then
            echo "ERROR: Compiled CSS file 'css/tooplate-style.css' not found after build!"
            exit 1
          fi
          echo "Build check successful: css/tooplate-style.css found."

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build # Only run deploy if the 'build' job succeeds
    # Only deploy on a direct push (merge) to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use a specific Node version for deployment consistency
          cache: 'npm'

      - name: Install dependencies
        # Installs dependencies from root package.json (e.g., sass compiler)
        run: npm install 

      - name: Build project (e.g., Sass compilation)
        # Runs the 'build' script from root package.json, which should include 'build:sass'
        run: npm run build 

      - name: FTP Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        # The 'with:' block contains inputs for the action.
        # All keys under 'with:' (server, username, password, local-dir, remote-dir)
        # MUST have the exact same indentation level (e.g., 2 spaces more than 'with:').
        with:
          # FTP Server address from GitHub Secrets
          server: ${{ secrets.FTP_SERVER }}
          # FTP Username from GitHub Secrets
          username: ${{ secrets.FTP_USERNAME }}
          # FTP Password from GitHub Secrets
          password: ${{ secrets.FTP_PASSWORD }}
          # Local directory to upload from.
          # './' means the root of your repository after the build step.
          # If your build outputs to a 'dist' folder, change this to './dist/'.
          local-dir: ./ 
          # Remote directory on the FTP server to upload files to.
          # THIS LINE IS CRITICAL FOR INDENTATION.
          # It must be aligned precisely with 'server:', 'username:', 'password:', and 'local-dir:'.
          # Example value for FTP_REMOTE_DIR secret: public_html
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # port: 21 
          # ^ Uncomment and change if your FTP server uses a different port.
          # dangerous-clean-slate: false 
          # ^ Set to true ONLY if you want to wipe the remote-dir before uploading. Use with extreme caution.
